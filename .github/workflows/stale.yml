name: Stale issues

on:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: 'No activity for 45 days - closing in 14 days unless there is an update.'
          stale-pr-message: 'No activity for 45 days - closing in 14 days unless there is an update.'
          exempt-issue-labels: 'pinned,security'
