name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate electron-builder config
        run: node scripts/validate-build-config.js
      # Early warning only: Cloudflare picks our edge CA, so if it changes,
      # pinned clients break and this is where we find out. Non-blocking,
      # because a network hiccup on a runner must not fail unrelated PRs.
      - name: Check certificate pins against live site
        run: npm run check-pins
        continue-on-error: true
      - name: Syntax check
        run: |
          for f in main.js preload.js toast-preload.js renderer/renderer.js renderer/toast.js renderer/views/*.js; do
            node --check "$f"
          done
