name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Validate electron-builder config
        run: node scripts/validate-build-config.js
      # Cloudflare picks our edge CA, so if it changes, pinned clients break and
      # this is where we find out. Exit 2 means the runner could not reach the
      # site and is tolerated; exit 1 means the pins genuinely do not match, or
      # the script itself broke, and must fail. It previously ran with
      # continue-on-error, which hid the script breaking when the pins moved.
      - name: Check certificate pins against live site
        run: |
          npm run check-pins && exit 0
          code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::could not reach mctema.lt; pin check skipped"
            exit 0
          fi
          exit $code
