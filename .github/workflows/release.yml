name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download bundled JRE
        run: npm run download-jre
      - name: Build installer
        run: npm run dist
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem build/MCTemaLauncher-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii build/SHA256SUMS.txt
          Get-Content build/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: startsWith(github.ref, 'refs/tags/')
        id: attest
        with:
          subject-path: build/MCTemaLauncher-Setup-*.exe
      - name: Bundle attestation
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" build/MCTemaLauncher-Setup.intoto.jsonl
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            build/MCTemaLauncher-Setup-*.exe
            build/MCTemaLauncher-Setup-*.exe.blockmap
            build/latest.yml
            build/SHA256SUMS.txt
            build/MCTemaLauncher-Setup.intoto.jsonl

  build-linux:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download bundled JRE (linux)
        run: npm run download-jre-linux
      - name: Build AppImage + deb
        run: npm run dist-linux
      - name: Checksums
        run: |
          cd build
          sha256sum MCTemaLauncher-*.AppImage MCTemaLauncher-*.deb > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: startsWith(github.ref, 'refs/tags/')
        id: attest
        with:
          subject-path: |
            build/MCTemaLauncher-*.AppImage
            build/MCTemaLauncher-*.deb
      - name: Bundle attestation
        if: startsWith(github.ref, 'refs/tags/')
        run: cp "${{ steps.attest.outputs.bundle-path }}" build/MCTemaLauncher-linux.intoto.jsonl
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            build/MCTemaLauncher-*.AppImage
            build/MCTemaLauncher-*.deb
            build/latest-linux.yml
            build/SHA256SUMS-linux.txt
            build/MCTemaLauncher-linux.intoto.jsonl
