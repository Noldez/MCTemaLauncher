name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download bundled JRE
        run: npm run download-jre
      - name: Build installer
        run: npm run dist
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem build/MCTemaLauncher-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii build/SHA256SUMS.txt
          Get-Content build/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        id: attest
        with:
          subject-path: build/MCTemaLauncher-Setup-*.exe
      - name: Bundle attestation
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" build/MCTemaLauncher-Setup.intoto.jsonl
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            build/MCTemaLauncher-Setup-*.exe
            build/MCTemaLauncher-Setup-*.exe.blockmap
            build/latest.yml
            build/SHA256SUMS.txt
            build/MCTemaLauncher-Setup.intoto.jsonl
