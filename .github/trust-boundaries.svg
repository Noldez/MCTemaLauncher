<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 408" width="920" height="408" role="img" aria-label="Trust boundaries: the password stops at the launcher, only a single-use ticket reaches the game">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101318"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6672"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <style>
    .t { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .zone { font-size: 10px; font-weight: 700; letter-spacing: 2px; fill: #5c6672; }
    .node { font-size: 13px; font-weight: 600; fill: #f2f2f4; }
    .sub  { font-size: 10.5px; fill: #8b8b93; }
    .edge { font-size: 10px; fill: #8b8b93; }
    .edgeG { font-size: 10px; fill: #4ade80; font-weight: 600; }
  </style>

  <rect width="920" height="408" rx="16" fill="url(#card)"/>

  <!-- zones -->
  <rect x="20" y="46" width="404" height="306" rx="13" fill="#ffffff" fill-opacity=".016" stroke="#ffffff" stroke-opacity=".07"/>
  <rect x="600" y="46" width="300" height="306" rx="13" fill="#ffffff" fill-opacity=".016" stroke="#ffffff" stroke-opacity=".07"/>
  <text class="t zone" x="36" y="34">YOUR MACHINE</text>
  <text class="t zone" x="616" y="34">MCTEMA.LT</text>
  <text class="t zone" x="452" y="34">NETWORK</text>

  <!-- renderer -->
  <rect x="44" y="72" width="180" height="60" rx="11" fill="#151a21" stroke="#2a3340"/>
  <text class="t node" x="60" y="98">Interface</text>
  <text class="t sub"  x="60" y="116">no Node, no network</text>

  <!-- main process (accent) -->
  <ellipse cx="314" cy="196" rx="140" ry="86" fill="url(#glowG)"/>
  <rect x="240" y="160" width="168" height="72" rx="12" fill="#12181a" stroke="#4ade80" stroke-opacity=".55"/>
  <text class="t node" x="258" y="190">Launcher</text>
  <text class="t sub"  x="258" y="209">the only part that</text>
  <text class="t sub"  x="258" y="223">reaches disk and net</text>

  <!-- keystore -->
  <rect x="44" y="168" width="150" height="60" rx="11" fill="#151a21" stroke="#2a3340"/>
  <text class="t node" x="60" y="194">OS keystore</text>
  <text class="t sub"  x="60" y="212">password, encrypted</text>

  <!-- game jvm (hostile zone) -->
  <ellipse cx="134" cy="300" rx="120" ry="60" fill="url(#glowR)"/>
  <rect x="44" y="272" width="228" height="60" rx="11" fill="#1a1214" stroke="#ef4444" stroke-opacity=".5"/>
  <text class="t node" x="60" y="298">Minecraft</text>
  <text class="t sub"  x="60" y="316">assume every mod here reads all</text>

  <!-- server side -->
  <rect x="628" y="120" width="244" height="60" rx="11" fill="#151a21" stroke="#2a3340"/>
  <text class="t node" x="644" y="146">Accounts and social API</text>
  <text class="t sub"  x="644" y="164">tokens stored only as hashes</text>

  <rect x="628" y="216" width="244" height="60" rx="11" fill="#151a21" stroke="#2a3340"/>
  <text class="t node" x="644" y="242">Release signing</text>
  <text class="t sub"  x="644" y="260">key kept offline, never here</text>

  <!-- edges -->
  <path d="M134 132 L134 154 L232 154 L232 178" fill="none" stroke="#5c6672" stroke-width="1.4" marker-end="url(#ar)"/>
  <text class="t edge" x="146" y="148">named calls only</text>

  <path d="M194 198 L232 198" fill="none" stroke="#5c6672" stroke-width="1.4" marker-end="url(#ar)"/>

  <path d="M280 232 L280 252 L190 252 L190 264" fill="none" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#arG)"/>
  <text class="t edgeG" x="298" y="250">single-use ticket only</text>

  <path d="M408 186 L620 150" fill="none" stroke="#4ade80" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#arG)"/>
  <text class="t edgeG" x="452" y="160">pinned TLS</text>

  <path d="M620 246 L412 214" fill="none" stroke="#5c6672" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text class="t edge" x="452" y="248">signed update manifest</text>

  <!-- the point -->
  <text class="t sub" x="460" y="390" font-size="11.5" text-anchor="middle">The password crosses one boundary and stops. What continues into the game is worthless once used.</text>
</svg>
